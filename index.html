<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Une table de ping-pong minimaliste aux couleurs vives."
    />
    <title>KeyPong</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game" aria-label="Table de ping-pong">
      <section class="word-panel word-panel--top" data-word-panel="top" aria-live="polite">
        <div class="word-panel__entry">
          <span class="typed-word" data-typed-word="top">-</span>
          <span class="word-valid" data-word-valid="top" aria-label="Mot valide">✓</span>
        </div>
      </section>

      <div class="scene" data-game-scene>
        <div class="table" data-table>
          <div class="letter-grid" data-letter-grid aria-label="Grille de lettres"></div>
          <div class="net" data-net aria-hidden="true"></div>
        </div>

        <div class="ball" data-ball aria-label="Balle de ping-pong"></div>
        <div class="shot-callout" data-shot-callout role="status" aria-live="polite"></div>

        <div class="paddle paddle--top" data-paddle="top" aria-label="Raquette bleue du haut">
          <div class="paddle__body" data-paddle-body>
            <img class="paddle__icon" src="raquette-bleue.svg" alt="" />
            <span class="paddle__sweet-spot" data-sweet-spot aria-hidden="true"></span>
          </div>
        </div>

        <div class="paddle paddle--bottom" data-paddle="bottom" aria-label="Raquette rouge du bas">
          <div class="paddle__body" data-paddle-body>
            <img class="paddle__icon" src="raquette.svg" alt="" />
            <span class="paddle__sweet-spot" data-sweet-spot aria-hidden="true"></span>
          </div>
        </div>
      </div>

      <section class="word-panel word-panel--bottom" data-word-panel="bottom" aria-live="polite">
        <div class="word-panel__entry">
          <span class="typed-word" data-typed-word="bottom">-</span>
          <span class="word-valid" data-word-valid="bottom" aria-label="Mot valide">✓</span>
        </div>
      </section>
    </main>

    <script src="dictionary.js"></script>
    <script src="script.js"></script>
  </body>
</html>
