<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Une table de ping-pong minimaliste aux couleurs vives."
    />
    <title>KeyPong</title>
    <link rel="stylesheet" href="styles.css?v=20261114210007" />
  </head>
  <body>
    <div class="app">
    <header class="site-header">KEYPONG</header>
    <main class="game" aria-label="Table de ping-pong">
      <section class="word-panel word-panel--top" data-word-panel="top" aria-live="polite">
        <div class="word-panel__entry">
          <span class="typed-word" data-typed-word="top">-</span>
          <span class="word-valid" data-word-valid="top" aria-label="Mot valide">✓</span>
        </div>
      </section>

      <div class="scene" data-game-scene>
        <div class="table" data-table>
          <div class="letter-grid" data-letter-grid aria-label="Grille de lettres"></div>
          <div class="net" data-net aria-hidden="true"></div>
        </div>

        <div class="clock" aria-hidden="true">
          <div class="clock__time" data-clock-time="top"></div>
          <!-- Sablier en traits vectoriels, même style que les raquettes (contour épais, aplats). -->
          <svg class="hourglass" data-hourglass viewBox="0 0 60 90">
            <defs>
              <clipPath id="hourglass-glass">
                <path d="M12 14H48V26L33 45L48 64V76H12V64L27 45L12 26Z" />
              </clipPath>
            </defs>
            <g stroke="#252323" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
              <path fill="#fffaf0" d="M12 14H48V26L33 45L48 64V76H12V64L27 45L12 26Z" />
              <g class="hourglass__sand" clip-path="url(#hourglass-glass)" stroke="none" fill="#e9a23b">
                <rect data-sand-top x="0" y="20" width="60" height="25" />
                <rect data-sand-bottom x="0" y="76" width="60" height="0" />
                <line
                  class="hourglass__stream"
                  data-sand-stream
                  x1="30"
                  y1="45"
                  x2="30"
                  y2="76"
                  stroke="#e9a23b"
                  stroke-width="3"
                  stroke-linecap="butt"
                  visibility="hidden"
                />
              </g>
              <path fill="none" d="M12 14H48V26L33 45L48 64V76H12V64L27 45L12 26Z" />
              <rect fill="#f9d495" x="5" y="4" width="50" height="10" rx="2" />
              <rect fill="#f9d495" x="5" y="76" width="50" height="10" rx="2" />
            </g>
          </svg>
          <div class="clock__time" data-clock-time="bottom"></div>
        </div>

        <div class="ball" data-ball aria-label="Balle de ping-pong"></div>
        <div class="shot-callout" data-shot-callout role="status" aria-live="polite"></div>

        <div class="paddle-layer" data-paddle-layer>
        <div class="paddle paddle--top" data-paddle="top" aria-label="Raquette bleue du haut">
          <div class="paddle__body" data-paddle-body>
            <img class="paddle__icon" src="raquette-bleue.svg" alt="" />
            <span class="paddle__sweet-spot" data-sweet-spot aria-hidden="true"></span>
          </div>
        </div>

        <div class="paddle paddle--bottom" data-paddle="bottom" aria-label="Raquette rouge du bas">
          <div class="paddle__body" data-paddle-body>
            <img class="paddle__icon" src="raquette.svg" alt="" />
            <span class="paddle__sweet-spot" data-sweet-spot aria-hidden="true"></span>
          </div>
        </div>
        </div>
      </div>

      <section class="word-panel word-panel--bottom" data-word-panel="bottom" aria-live="polite">
        <div class="word-panel__entry">
          <span class="typed-word" data-typed-word="bottom">-</span>
          <span class="word-valid" data-word-valid="bottom" aria-label="Mot valide">✓</span>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      © 2026 Keypong · Dictionnaire
      <a href="https://grammalecte.net/" target="_blank" rel="noopener">Grammalecte</a>
      (MPL 2.0) ·
      <a href="https://github.com/eliottbourrigan/keypong" target="_blank" rel="noopener">Code source</a>
    </footer>
    </div>

    <script src="dictionary.js"></script>
    <script src="script.js?v=20261114210007"></script>
  </body>
</html>
